# Lychee link-checker configuration for tarkovtracker-org/.github
no_progress = true
max_concurrency = 4
max_retries = 3
retry_wait_time = 2
accept = ["200", "204", "206", "301", "302", "308"]

# Exclude hosts that use anti-bot or require JavaScript execution
exclude = [
  'localhost',
  '127\.0\.0\.1',
  'discord\.gg',
  'x\.com',
  'twitter\.com',
  'tarkovtracker\.org'
]
