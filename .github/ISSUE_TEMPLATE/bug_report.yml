name: Bug Report
description: Report unexpected behavior or a defect in a TarkovTracker-org project
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible so we can reproduce and fix it quickly.

        This issue will be created in the repository where you opened this form. If the problem affects a different project, open the form in that project's repository instead — see the [support directory](https://github.com/tarkovtracker-org/.github/blob/main/SUPPORT.md) for routing.
        *For security vulnerabilities, please do **not** use this form — follow our [Security Policy](https://github.com/tarkovtracker-org/.github/blob/main/SECURITY.md) instead.*
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions so maintainers can reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages, console logs, or screenshots)
      placeholder: What actually occurred?
    validations:
      required: true
  - type: dropdown
    id: game-mode
    attributes:
      label: Game Mode (If Applicable)
      description: Which Escape from Tarkov mode does this affect?
      options:
        - Not Applicable
        - PvP Mode
        - PvE Mode
        - Both PvP and PvE
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment & Version
      description: OS, browser, runtime, or application version.
      placeholder: e.g., Windows 11, v1.4.2
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Paste relevant log output, console traces, or drag and drop screenshots here.
      placeholder: Drag images or paste text here
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I have searched existing issues (both open and closed) to ensure this is not a duplicate.
          required: true
        - label: I have verified this is not a security vulnerability (see SECURITY.md).
          required: true
